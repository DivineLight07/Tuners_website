<!DOCTYPE html>
<html>
<head>
  <title>Tuners Courses</title>
  <link rel="stylesheet" href="courses.css">
</head>
<body>

<header>
  <div class="header-inner">
    <img src="Tuners-Logo.png" class="site-logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">About us</a>
      <a href="#">Apply</a>
      <a href="#">Contact</a>
      <a href="#">Dashboard</a>
    </nav>
  </div>
</header>

<h1>Courses</h1>
<p class="cta">Explore our music courses</p>

<div class="role-buttons">
  <button onclick="setRole('guest')">Guest</button>
  <button onclick="setRole('member')">Member</button>
  <button onclick="setRole('admin')">Admin</button>
</div>

<div id="courses" class="courses-grid"></div>

<div id="adminPanel" class="hidden">
  <h2>Add Course</h2>
  <input id="title" placeholder="Course Title"><br>
  <input id="desc" placeholder="Description"><br>
  <input id="img" placeholder="Image URL"><br>
  <button onclick="addCourse()">Add Course</button>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-links">
      <a href="https://www.instagram.com/tunersclubmiu" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/TunersClubMIU" target="_blank">Facebook</a>
      <a href="https://www.youtube.com" target="_blank">YouTube</a>
      <a href="https://soundcloud.com" target="_blank">SoundCloud</a>
      <a href="https://tiktok.com" target="_blank">TikTok</a>
    </div>
    <img src="Tuners-Logo.png" class="footer-logo">
  </div>
</footer>

<script src="courses.js"></script>
</body>
</html>
