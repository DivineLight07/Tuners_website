<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MIU Tuners Club - Apply</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>MIU Tuners Club Application</h1>
        <p>Fill out the form below to apply for membership.</p>

        <form id="applicationForm">

            <label>Full Name:</label>
            <input type="text" id="fullname">

            <label>Student ID:</label>
            <input type="text" id="student_id">

            <label>Year:</label>
            <select id="year">
                <option value="">Select your year</option>
                <option value="1st">1st Year</option>
                <option value="2nd">2nd Year</option>
                <option value="3rd">3rd Year</option>
                <option value="4th">4th Year</option>
                <option value="graduate">Graduate</option>
            </select>

            <label>Which committee are you interested in?</label>
            <select id="committee">
                <option value="">Select a committee</option>
                <option value="events">Events committee</option>
                <option value="media">Social media committee</option>
                <option value="technical">Technical committee</option>
                <option value="academic">Academic committee</option>
                <option value="musician">Musician committee</option>
            </select>

            <label>Major:</label>
            <input type="text" id="major" placeholder="e.g. Computer Science">

            <!-- Hidden by default -->
            <div id="musician_fields">
                <label>What instrument do you play?</label>
                <input type="text" id="instrument" placeholder="e.g. Guitar, Piano...">
            </div>

            <label>How did you hear about the club?</label>
            <input type="text" id="hear_about">

            <label>Why do you want to join?</label>
            <textarea id="reason" rows="4"></textarea>

            <label>Email:</label>
            <input type="email" id="email" placeholder="student@miu.edu.eg">

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
